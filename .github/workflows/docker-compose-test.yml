name: docker-compose-test

on:
  workflow_call:
  push:
    branches:
      - '*'
      - '!deploy'
      - '!gh-pages'

permissions:
  contents: read
  actions: write

jobs:
  docker-compose-tests:
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    # this has a chance of infinite loop if we write a test wrong, timeout should catch it eventually.
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install node v24.13.1
        uses: actions/setup-node@v3
        with:
          node-version: 24.13.1
        
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ hashFiles('Dockerfile', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Load .env variables
        run: |
          cp .env.example .env
          echo "Loaded .env variables"

      - name: Install Dependencies
        run: |
          pnpm add -D typescript@5.9.3
          pnpm install --frozen-lockfile

      - name: Set up Supabase Config
        run: |
          echo "Setting up Supabase config..."
          COMMIT_HASH=$(git rev-parse --short HEAD)
          SCHEMA_NAME="docker_test_${COMMIT_HASH}"
          echo "Setting schema to ${SCHEMA_NAME}..."
          pnpm run sb:set-schema ${SCHEMA_NAME}
          sed -i "s/^project_id = .*/project_id = \"${SCHEMA_NAME}\"/" supabase/config.toml
          pnpm script supabase/sb-random-ports
          pnpm sb:start --debug
          echo "Waiting for supabase to be ready..."
          until pnpm run sb:status | grep -q "Development Tools"; do
            echo "Supabase not ready yet, waiting..."
            sleep 5
          done
          echo "Configuring local supabase"
          pnpm run sb:local-config
          pnpm run sb:push

      # - name: Init supabase types
      #   run: pnpm run sb:pull-types

      - name: Build app
        run: pnpm build

      - name: Prepare Docker env
        run: cp .env .docker.env

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: my-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker layer cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Debug Docker images
        run: |
          echo "Listing all docker images:"
          docker images
          echo "Compose images for project 'test':"
          docker compose --project-name test images
          echo "Compose ps for project 'test':"
          docker compose --project-name test ps

      - name: Start App
        run: docker compose --project-name test up -d app

      - name: Debug container state
        run: |
          echo "Container status:"
          docker compose --project-name test ps
          echo "App logs:"
          docker compose --project-name test logs app --tail=50
          echo "Port bindings:"
          docker port $(docker compose --project-name test ps -q app) || true

      - name: Wait for app startup
        run: |
          echo "Waiting for app to fully start..."
          for i in $(seq 1 30); do
            if docker compose --project-name test logs app | grep -q "listening on"; then
              echo "App is ready! (found 'listening on' in logs)"
              exit 0
            fi
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "App responding to requests!"
              exit 0
            fi
            echo "Waiting for app startup... (attempt $i/30)"
            sleep 2
          done
          echo "App failed to start within timeout!"
          echo "Final app logs:"
          docker compose --project-name test logs app --tail=20
          exit 1

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image my-app:latest

      - name: Shutdown supabase
        if: always()
        run: |
          pnpm sb:stop --no-backup || true
          docker rm -f $(docker ps -aq --filter "name=supabase-${SCHEMA_NAME}") || true

      - name: Tear down Docker Compose
        if: always()
        run: docker compose --project-name test down -v --remove-orphans || true

      - name: Clean up Supabase config
        if: always()
        run: rm -f .env
